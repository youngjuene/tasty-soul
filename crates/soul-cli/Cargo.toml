[package]
name = "soul-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "soul"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
serde = "1.0.229"
serde_json = "1.0.151"
soul-agent = { version = "0.1.0", path = "../soul-agent" }
soul-core = { version = "0.1.0", path = "../soul-core" }
soul-media = { version = "0.1.0", path = "../soul-media" }
soul-net = { version = "0.1.0", path = "../soul-net" }
soul-pipeline = { version = "0.1.0", path = "../soul-pipeline" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "process", "time", "signal"] }
