name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: 시스템 의존성 (Tauri · 미디어)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          # ffmpeg 이 없으면 soul-media 테스트가 조용히 건너뛰어진다
          # (`ffmpeg::locate()` 가 None 이면 early return). 실제로 돌려야 의미가 있다.
          sudo apt-get install -y ffmpeg
      # §19.4 · T32 · T34 — 크레이트 경계가 먼저다. 이게 깨지면 나머지는 의미가 없다.
      - name: 의존 경계 검사
        run: ./ci/check-deps.sh
      # 환경 스크립트가 깨지면 새 기여자가 첫 5분에 막힌다. 문법과 진단 경로를 검사한다.
      - name: 환경 스크립트 (문법 · --check)
        run: |
          bash -n scripts/setup.sh
          sudo apt-get install -y -qq shellcheck
          shellcheck -S warning scripts/setup.sh
          ./scripts/setup.sh --check --no-keys
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # 인수 테스트는 완전 오프라인이다 (§17). 네트워크가 필요한 것은 SOUL_E2E 로 게이트된다.
      - name: 인수 테스트 (오프라인)
        run: cargo test --workspace --all-targets

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
