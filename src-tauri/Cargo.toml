[package]
name = "tasty-soul"
version.workspace = true
edition.workspace = true

[lib]
name = "tasty_soul_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "tasty-soul"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
serde = "1.0.229"
serde_json = "1.0.151"
soul-agent = { version = "0.1.0", path = "../crates/soul-agent" }
soul-core = { version = "0.1.0", path = "../crates/soul-core" }
soul-media = { version = "0.1.0", path = "../crates/soul-media" }
soul-net = { version = "0.1.0", path = "../crates/soul-net" }
soul-pipeline = { version = "0.1.0", path = "../crates/soul-pipeline" }
tauri = { version = "2.11.5", features = [] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = "2.4.3"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
